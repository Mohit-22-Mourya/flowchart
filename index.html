function paint(){

 if(it){rn=new Set();re=new Set();if(it.t==='n'){rn.add(it.id);E.forEach(e=>{if(e.s===it.id||e.t===it.id){re.add(e.id);rn.add(e.s);rn.add(e.t)}})}else{const e=EM[it.id];re.add(e.id);rn.add(e.s);rn.add(e.t)}}

 else{const e=EM[sel.id];h.textContent=e.label;sub.textContent='Connection '+(E.indexOf(e)+1)+' of '+E.length+', direction shown by the arrow.';sec('From',[panelBtn({t:'n',id:e.s},head(e.s))]);sec('To',[panelBtn({t:'n',id:e.t},head(e.t))])}
